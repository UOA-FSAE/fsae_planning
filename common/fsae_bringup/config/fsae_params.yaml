# Central parameter config for the FSDS-simulator planning stack.
#
# Single source of truth for tunables (mirrors fsae_autonomous/common/fsae_bringup).
# Launch files load this file and pass it to each node; ROS matches params by node
# name, so each top-level key MUST equal the node name (== executable name).

# --- perception (simulator stand-in) ---
sim_perception:
  ros__parameters:
    look_ahead: 25.0    # m ahead included in the forward preview box
    look_wide: 10.0     # m lateral half-width of the forward box
    min_ahead: 0.5      # m; forward box ignores cones behind / at the car
    # 25.0 — kept >= centerline_planner's look_radius/plan_horizon,
    # otherwise cones for a tight corner never reach the planner far enough
    # out for it to detect and brake for the corner in time (see that block's
    # own comment for the full derivation).
    look_radius: 25.0   # m; omni-directional visibility radius (corner-robust)
    full_track: false   # publish the whole map (set true for skidpad by sim.launch.py)
    # Pose and cones publish on SEPARATE timers.
    # pose_rate MUST be >= the controller rate (CONTROL_HZ = 20 Hz). Both used
    # to share one 10 Hz timer, so the 20 Hz controller re-solved against an
    # unchanged pose on half its ticks (measured: 50.5% of control steps had a
    # byte-identical car_x/car_y), which drove steering oscillation. FSDS
    # publishes odom at 250 Hz, so 20 Hz here costs nothing.
    pose_rate: 20.0     # Hz; car_position. Keep >= controller rate.
    # Cones stay slower on purpose: cropping the map and building three
    # messages is this node's expensive path, and the planner gains nothing
    # from it running at the control rate.
    cone_rate: 10.0     # Hz; left/right_track + cone_detection
    # Kart camera emulation (see sim_perception's docstring). 'window' = the
    # look_radius/box crop above, published straight as the *_track topics;
    # 'camera' = a forward wedge publishing only cone_detection frames, which
    # cone_mapper_shim (below, the kart's node) turns into the tracks -- the
    # kart's camera -> shim -> planner chain. Overridable from sim.launch.py.
    fov_mode: 'window'
    camera_hfov_deg: 110.0        # ZED 2i, 2.1 mm lens (72 for the 4 mm lens)
    # m; the ZED 2i measures depth to 20 m, 98% of the kart's fused cones are
    # within 8 m. 10 is the floor for the sim: FSDS puts the first cones past
    # the start gate 9.2-9.4 m ahead, and with less the car is left a ~2.7 m
    # stub at the start, which sets a speed too low for the FSDS car to move off.
    camera_range: 10.0
    camera_rate: 8.0              # Hz; the kart's /cone_detection_fused runs 8.0-8.5 Hz
    camera_dropout: 0.0           # per-cone, per-frame miss probability
    camera_fixed_miss: 0.0        # fraction of blue/yellow cones never detected (sparse-track emulation)
    camera_noise_std: 0.0         # m per axis at 10 m, linear in range
    camera_both_colours_gate: false
    camera_seed: 0

# --- the kart's cone_mapper_shim (fsae_planning, verbatim copy) ---
# Camera mode only (perception.launch.py starts it): turns sim_perception's
# cone_detection frames into /fsae/slam/*_track exactly as on the kart.
# Values copied from fsae_autonomous' fsae_params.yaml -- keep them in step.
cone_mapper_shim:
  ros__parameters:
    invert_cones: false
    match_radius: 0.8                # m, same-cone tolerance
    persistence_sec: 1.0             # s, cone survival with no re-detection (code default 0.5)
    filter_window: 5                 # detections averaged per cone (moving average)
    publish_rate: 20.0               # Hz, fixed publish/expiry tick

# --- cone_memory (fsae_planning): longer-lived local cone map, own process ---
# Reads the same frames as the shim and publishes /fsae/cone_memory/*_track;
# the planner reads those instead of /fsae/slam/* with
# planner_cone_source:=memory (sim.launch.py). See cone_memory.py.
# view_hfov_deg/view_range follow camera_hfov_deg/camera_range when launched
# from sim.launch.py.
cone_memory:
  ros__parameters:
    invert_cones: false
    match_radius: 0.8                # m, as the shim
    filter_window: 5                 # as the shim
    persistence_sec: 1.0             # s, always kept this long (the shim's whole life)
    keep_radius: 10.0                # m, then kept while this close to the car...
    max_age: 30.0                    # s, ...up to this long since last seen
    min_hits: 2                      # frames before a cone is published (phantom guard)
    view_hfov_deg: 110.0
    view_range: 16.0
    max_misses: 3                    # consecutive in-view misses that drop a cone
    reset_jump: 5.0                  # m, pose jump that clears the memory
    publish_rate: 20.0               # Hz

# --- planning (one planner runs at a time; node name == executable) ---
# `smooth` is the per-point spline smoothing budget (splprep s = smooth * n_pts,
# capped internally so a longer lookahead can't reshape the near path). 0.0 →
# interpolating spline that reproduces every cone-pairing kink; a small positive
# value approximates the midpoints, removing left-right bumps on straights. Kept
# low so the corner line stays on the true centreline (first-lap safety);
# residual straight-line jitter is absorbed downstream by the controller's
# steering low-pass and the planner's path_blend. Raise for smoother/lazier
# lines, lower if corners get cut.
# `look_radius` (m): the planner crops the accumulated cone map to this radius
# (omni) OR the forward box, so the path spans corners instead of truncating when
# the track curves out of a heading-aligned box.
# `plan_horizon` (m): arc-length the published centreline is clamped to. Makes
# the near path invariant to how far look_radius reaches. Keep >= the ~24 m
# controller speed-scan window (control_utils.curvature_speed's scan_end) — a
# tight hairpin (~2 m radius, v_target ~2.7 m/s) approached at v_max needs
# ~24 m to brake for at a realistic achieved deceleration; a shorter horizon
# reveals such a corner too late, saturating steering and spinning out at
# corner entry.
# `path_blend` (0<a<=1): temporal EMA weight toward each freshly-planned path, so
# successive paths ease between frames instead of jumping (which the controller
# tracks as a jerk). 1.0 disables blending; smaller = smoother/laggier.
# `midpoint_method`: 'delaunay' (default) turns each mixed triangle of a
# Delaunay triangulation of both boundaries into a corridor gate pair --
# wall-safe by construction, no per-step crossing check needed. 'nn' is the
# older exclusive-nearest-neighbour midpoint matching, kept for rollback and
# side-by-side comparison.
# `mid_min_gate`/`mid_max_gate` (m): cross-colour gate length band the
# 'delaunay' corridor accepts. Below the min is almost always a stray cone
# next to a genuine one; above the max means the triangulation bridged a gap
# with a missing intermediate cone.
# mid_max_gate is 6.5 here, NOT boundary._WALL_MID_MAX_DELAUNAY's 5.0 default:
# that default was measured on the real stack's track (cone-spacing p99 ~4.2 m)
# and does not transfer to the simulator's wider-spaced maps. A mixed
# triangle's gate edges include the DIAGONAL, ~hypot(track_width,
# cone_spacing) -- on tracks/comp_test_map_3 (3.50 m wide, same-colour spacing
# up to 4.94 m) those top out at 5.35 m, so 5.0 rejects 47% of all gates and
# the corridor walk finds NO gates at all on 172/200 sampled poses, silently
# falling through to build_local_path's naive nearest-cone pairing. 6.5 clears
# the measured maximum with ~20% margin while staying under
# boundary._WALL_MAX_DIST (7.0). Re-measure this for a track with different
# cone spacing.
# `max_pose_age`/`max_track_age`/`max_track_skew` (s): input staleness gates,
# measured from local arrival time (Track.msg has no header, and
# car_position's stamp is the upstream odom clock). A tick whose inputs fail
# these plans nothing rather than mixing a stale boundary pair.
# `max_point_jump`/`min_cone_clearance`/`min_usable_path_length` (m): output
# sanity gates. A wall crossing or clearance violation truncates the path at
# that point; a jump or a sub-minimum remaining length rejects it outright.
# `max_hold_deviation` (m): how far the car may be from a HELD path before the
# hold is dropped (localisation jump, or simply too much motion since).
# `use_orange`: plan with the big orange start/finish cones (rollback switch;
# false ignores both orange topics). `start_line_min_width`/`start_line_max_width`
# (m): width band for a valid orange pair; each big orange cone is classified
# from the valid pairs it is in (any number per cone) and then planned exactly
# like a blue/yellow cone. The gate is as wide as
# the track; 5.0 m is the team's bound for FSG-style start areas (FSDS gates
# are 3.45-4.34 m, test tracks are no wider). The kart's run-4 gate is 2.4 m;
# FSDS same-side gate cones are 1.30 m apart, below the 2.0 m min.
# `same_side_max` (m): an orange cone in no valid pair takes the side of a
# classified orange this close along the track; otherwise it only counts for
# clearance.
centerline_planner:
  ros__parameters:
    smooth: 0.015
    look_radius: 25.0
    plan_horizon: 25.0
    path_blend: 0.4
    path_hold_timeout: 0.3   # s; republish the last known-good path this long before giving up
    midpoint_method: 'delaunay'
    mid_min_gate: 1.2
    mid_max_gate: 6.5
    max_pose_age: 0.15
    max_track_age: 0.50
    max_track_skew: 0.20
    max_point_jump: 10.0
    min_cone_clearance: 0.4
    min_usable_path_length: 2.0
    max_hold_deviation: 2.0
    use_orange: true
    start_line_min_width: 2.0
    start_line_max_width: 5.0
    same_side_max: 2.0
    # One-sided offset trace (centerline_planner's one_sided_* params). The
    # code defaults are the go-kart's (half width 0.5, min track 2.3 m ->
    # offsets 0.9 / 1.3 / 1.15). These are the FSDS car's: ~1.5 m wide (half
    # 0.75) on FS-rule tracks (min width 3.0 m; every FSDS map is 3.5 m):
    #   offset_min = 0.75 + 0.4 m margin to the seen side          = 1.15
    #   offset_max = 3.0 - 0.75 - 0.5 m margin to the unseen side  = 1.75
    #   offset_default = 3.0 / 2                                   = 1.5
    one_sided: true
    one_sided_car_half_width: 0.75
    one_sided_min_track_width: 3.0
    one_sided_offset_min: 1.15
    one_sided_offset_max: 1.75
    one_sided_offset_default: 1.5
    one_sided_taper: 3.0
    one_sided_min_walk: 4.0
    one_sided_trace_max_step: 7.0
    one_sided_trace_max_turn_deg: 80.0
    one_sided_good_len: 4.0
    one_sided_enter_ticks: 3
    one_sided_exit_ticks: 5
skidpad_planner:
  ros__parameters:
    v_start: 3.0        # m/s — speed at the start of the ramp
    ramp_accel: 0.25    # m/s per second — how fast the target speed rises
    v_cap: 25.0         # m/s — hard ceiling on the ramp

# --- control ---
controller:
  ros__parameters:
    v_max: 15.0         # m/s — top speed on straights
    v_min: 1.5          # m/s — minimum speed through tight corners
    stanley_gain: 1.0   # cross-track gain (k_cte)
fsds_bridge:
  ros__parameters: {}   # no tunables yet
